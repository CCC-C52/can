# Pull request ve geliştirme dalları için doğrulama. Üretim kimlik bilgilerine erişimi YOKTUR ve dağıtım yapmaz.
# Üretim dalına yapılan push'lar Release iş akışında aynı denetimlerden geçer (burada tekrar çalışmaz).
name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - claude/amazing-goodall-qkxupd

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/_checks.yml
