<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <title>Bağlantı yok</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #09090b; color: #f4f1ea; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { min-height: 100%; display: grid; place-items: center; padding: 24px; box-sizing: border-box; text-align: center; }
    h1 { font-family: "Playfair Display", Georgia, serif; font-weight: 600; font-size: 28px; margin: 0 0 8px; }
    p { color: #a1a0a8; margin: 0 0 20px; line-height: 1.5; }
    button { font: inherit; font-weight: 600; color: #17130a; background: #d8b26a; border: 0; border-radius: 12px; padding: 10px 18px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div>
      <h1>Bağlantı yok</h1>
      <p>Panel güncel verileri yalnızca çevrimiçiyken gösterir. İş verileri bu cihazda saklanmaz.</p>
      <button type="button" onclick="location.reload()">Tekrar dene</button>
    </div>
  </main>
</body>
</html>
