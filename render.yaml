# Render Blueprint — AI Operations Studio
# Kurulum: Render Dashboard → New → Blueprint → bu depoyu ve çalışma dalını seçin.
# Gizli değerler (sync: false) Blueprint ilk oluşturulurken Render ekranında sorulur; bu dosyada değer YOKTUR.
# Ayrıntılı adımlar: docs/DEPLOY.md
#
# OTOMATİK SÜRÜM HATTI: canlıya alma GitHub Actions "Release" iş akışıyla yapılır (docs/RELEASE.md). Render'ın kendi
# otomatik dağıtımı KAPALI kalmalıdır (iş akışı açık bulursa durur; iki ayrı dağıtım mekanizması olmaz).
#
# DAĞITIM DENETİMİ: servisler bu dalı izler. Geliştirme commit'lerinin canlıya kendiliğinden gitmemesi için
# otomatik dağıtım kapalıdır (autoDeployTrigger: off); canlıya alma sahibin Render'da "Manual Deploy" ile verdiği
# karardır. Render'ın bilinen bir sorunu nedeniyle Blueprint ayarı değişen commit'ler yine dağıtım tetikleyebilir:
# Dashboard'da servis → Settings → Auto-Deploy = Off ve Blueprint → Auto Sync = Off ayarlarını da kapatın.

envVarGroups:
  - name: aiops-shared
    envVars:
      - key: APP_MODE
        value: production
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_REGION
        value: auto
      # Bağlantı belirteçlerini veritabanında şifrelemek için; Render rastgele üretir, web ve işleyici aynı değeri kullanır.
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
      - key: ANTHROPIC_EFFORT
        value: medium
      - key: BACKUP_HOUR_UTC
        value: "2"
      - key: BACKUP_RETENTION_DAYS
        value: "14"

databases:
  - name: aiops-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: aiops
    user: aiops
    diskSizeGB: 5
    # Dış dünyadan doğrudan veritabanı bağlantısı kapalı; yalnızca Render iç ağındaki servisler erişir.
    ipAllowList: []

services:
  - type: web
    name: aiops-web
    runtime: docker
    plan: starter
    region: frankfurt
    branch: claude/amazing-goodall-qkxupd
    autoDeployTrigger: "off"
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    preDeployCommand: npm run db:migrate
    envVars:
      - fromGroup: aiops-shared
      - key: DATABASE_URL
        fromDatabase:
          name: aiops-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Dağıtım hattının durum ucu (/api/release/status) için; GitHub "production" ortamındaki RELEASE_STATUS_TOKEN ile aynı
      # değer (en az 32 karakter). Tanımlı değilse uç kapalıdır ve otomatik dağıtım web doğrulamasında durur.
      - key: RELEASE_STATUS_TOKEN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AIOPS_ANTHROPIC_API_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  - type: worker
    name: aiops-worker
    runtime: docker
    # Ölçüm (Ekim 2026): 1080x1920, 5 bölüm + geçişli kurguda ffmpeg ~440 MB + Node ~150 MB → Starter (512 MB) yetersiz.
    # Video kurgusu kullanılacaksa sahibin kararıyla Standard (2 GB, $25/ay) önerilir; bu dosya maliyeti kendiliğinden değiştirmez.
    plan: starter
    region: frankfurt
    branch: claude/amazing-goodall-qkxupd
    autoDeployTrigger: "off"
    dockerfilePath: ./Dockerfile
    dockerCommand: npm run worker
    envVars:
      - fromGroup: aiops-shared
      - key: DATABASE_URL
        fromDatabase:
          name: aiops-db
          property: connectionString
      - key: AIOPS_ANTHROPIC_API_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
